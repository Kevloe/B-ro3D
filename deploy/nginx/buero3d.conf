# nginx-Konfiguration für Büro 3D
#   - liefert die Web-App aus /var/www/buero3d aus (rein statisch, kein Backend)
#   - config.json und standard.json werden nie gecacht, damit ein neuer Standard sofort ankommt
#
# Installation auf Ubuntu:
#   sudo cp buero3d.conf /etc/nginx/sites-available/buero3d.conf
#   sudo ln -s /etc/nginx/sites-available/buero3d.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Anpassen: server_name.
#
# HTTPS: mit öffentlichem DNS-Namen  sudo apt install certbot python3-certbot-nginx
#                                    sudo certbot --nginx -d <hostname>
#        im internen Netz: Zertifikat der eigenen CA eintragen (siehe Block unten).

server {
    listen 80;
    listen [::]:80;

    server_name buero3d.example.local;   # <-- Hostname oder IP des Servers

    root /var/www/buero3d;
    index index.html;
    charset utf-8;

    # Einstellungen und Standard-Gebäude: immer frisch laden
    location ~ \.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seiten nie cachen, damit Updates sofort ankommen (Übersicht und Editor)
    location ~ ^/(index|editor)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gebaute Dateien haben einen Hash im Namen → lange cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Versteckte Dateien (.git, .env …) nicht ausliefern
    location ~ /\. {
        deny all;
    }
}

# --- HTTPS mit eigenem Zertifikat (internes Netz) --------------------------------
# Den Block oben dann auf eine Weiterleitung reduzieren:
#   server { listen 80; server_name buero3d.example.local; return 301 https://$host$request_uri; }
# und die Inhalte (root, locations, gzip) in diesen Block übernehmen:
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name buero3d.example.local;
#     ssl_certificate     /etc/ssl/certs/buero3d.crt;
#     ssl_certificate_key /etc/ssl/private/buero3d.key;
#     ...
# }
